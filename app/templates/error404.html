<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Encontrada - Fashion Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #c8a97e;
            margin-bottom: 0;
            line-height: 1;
        }
        .error-message {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #e9ecef;
            font-weight: 300;
        }
        .btn-primary {
            background: #c8a97e;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #b8976e;
            transform: translateY(-2px);
        }
        .lead {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #adb5bd;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">PÁGINA NO ENCONTRADA</h2>
        <p class="lead">Lo sentimos, la página que estás buscando no existe o ha sido movida.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            Volver al Inicio
        </a>
    </div>
</body>
</html>
